name: CI/CD Ktor App

on:
  push:
    branches: [ "master" ] # Спрацює, коли зробиш push у гілку master

jobs:
  build-and-push:
    runs-on: ubuntu-latest # Збираємо на швидких серверах GitHub
    permissions:
      contents: read
      packages: write  # ОСЬ ЦЕЙ РЯДОК ВИРІШУЄ ПРОБЛЕМУ
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle' # Вбудоване кешування бібліотек

      - name: Build Fat JAR
        run: ./gradlew buildFatJar --no-daemon

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          # Кеш для шарів докера
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Pull and Run
        run: |
          # Авторизація
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # Оновлюємо образ
          podman pull ghcr.io/${{ github.repository }}:latest
          
          # Запуск з автоматичною заміною старого контейнера
          # Ми прибираємо stop/rm, бо --replace робить це надійно
          podman run -d \
            --name ktor-app \
            --replace \
            --restart always \
            --net=host \
            ghcr.io/${{ github.repository }}:latest