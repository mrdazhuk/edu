name: CI/CD Ktor App

on:
  push:
    branches: [ "master" ] # Спрацює, коли зробиш push у гілку master

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64 # Збираємо під процесор малинки
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Pull and Run
        run: |
          # Авторизація Podman у реєстрі GitHub
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # Оновлюємо образ
          podman pull ghcr.io/${{ github.repository }}:latest
          
          # Перезапускаємо контейнер
          podman stop ktor-app || true
          podman rm ktor-app || true
          podman run -d \
            --name ktor-app \
            --restart always \
            --net=host \
            ghcr.io/${{ github.repository }}:latest